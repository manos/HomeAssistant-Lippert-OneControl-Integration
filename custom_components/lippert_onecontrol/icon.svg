<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5A8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#rvGrad)"/>
  
  <!-- RV Body - Main cabin -->
  <rect x="45" y="95" width="140" height="65" rx="8" ry="8" fill="#FFFFFF"/>
  
  <!-- RV Front cab (driver area) - slightly lower roofline -->
  <path d="M 165 95 L 165 160 L 200 160 L 200 115 C 200 105 195 95 185 95 Z" fill="#FFFFFF"/>
  
  <!-- RV Roof air conditioner unit -->
  <rect x="70" y="85" width="35" height="12" rx="3" ry="3" fill="#E0E0E0"/>
  
  <!-- Window - main living area -->
  <rect x="55" y="105" width="40" height="25" rx="3" ry="3" fill="#1E3A5F"/>
  
  <!-- Window - bedroom area -->
  <rect x="105" y="105" width="30" height="25" rx="3" ry="3" fill="#1E3A5F"/>
  
  <!-- Windshield -->
  <path d="M 170 105 L 170 130 L 195 130 L 195 118 C 195 110 190 105 182 105 Z" fill="#1E3A5F"/>
  
  <!-- Door -->
  <rect x="145" y="115" width="15" height="45" rx="2" ry="2" fill="#E0E0E0"/>
  <circle cx="148" cy="140" r="2" fill="#666666"/>
  
  <!-- Wheels -->
  <circle cx="75" cy="165" r="18" fill="#333333"/>
  <circle cx="75" cy="165" r="10" fill="#666666"/>
  <circle cx="75" cy="165" r="4" fill="#333333"/>
  
  <circle cx="180" cy="165" r="18" fill="#333333"/>
  <circle cx="180" cy="165" r="10" fill="#666666"/>
  <circle cx="180" cy="165" r="4" fill="#333333"/>
  
  <!-- Signal arcs (WiFi/connectivity symbol) - top right -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M 195 55 A 25 25 0 0 1 220 80"/>
    <path d="M 200 68 A 12 12 0 0 1 212 80"/>
  </g>
  
  <!-- Signal dot -->
  <circle cx="207" cy="87" r="5" fill="#FFFFFF" opacity="0.9"/>
</svg>
